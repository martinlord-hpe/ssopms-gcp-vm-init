---
- name: Configure SSOPMS VM
  hosts: ssopms
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Run unminimize
      ansible.builtin.shell:
        cmd: yes | unminimize
      register: unminimize_result
      changed_when: "'Already running' not in unminimize_result.stdout"
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Install unzip
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Install Rust via rustup
      ansible.builtin.shell:
        cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: "/home/{{ ansible_user }}/.cargo/bin/rustc"
      become_user: "{{ ansible_user }}"

    - name: Check current Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_version_check
      changed_when: false
      failed_when: false

    - name: Check current npm version
      ansible.builtin.command:
        cmd: npm --version
      register: npm_version_check
      changed_when: false
      failed_when: false

    - name: Remove old Node.js and npm packages
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
          - libnode-dev
        state: absent
        purge: true
      when: >
        node_version_check.rc != 0 or
        not node_version_check.stdout.startswith('v22.') or
        npm_version_check.rc != 0 or
        npm_version_check.stdout != '11.11.0'

    - name: Add NodeSource GPG key
      ansible.builtin.apt_key:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        state: present

    - name: Add NodeSource 22.x repository
      ansible.builtin.apt_repository:
        repo: "deb https://deb.nodesource.com/node_22.x nodistro main"
        state: present

    - name: Install Node.js from NodeSource
      ansible.builtin.apt:
        name: nodejs
        state: latest
        update_cache: true

    - name: Install npm 11.11.0
      ansible.builtin.command:
        cmd: npm install -g npm@11.11.0
      register: npm_install_result
      changed_when: "'added' in npm_install_result.stdout or 'updated' in npm_install_result.stdout"

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create base directory
      ansible.builtin.file:
        path: "{{ base_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0775"
        recurse: false

    - name: Set parent directory permissions
      ansible.builtin.file:
        path: "{{ base_dir | dirname }}"
        owner: "{{ ansible_user }}"
        mode: "0775"

    - name: Ensure remote .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy SSH private key to remote user
      ansible.builtin.copy:
        src: "{{ ansible_ssh_private_key_file }}"
        dest: "/home/{{ ansible_user }}/.ssh/{{ ansible_ssh_private_key_file | basename }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Copy build env file to remote user
      ansible.builtin.copy:
        src: "{{ build_env }}"
        dest: "/home/{{ ansible_user }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Get UID of ansible_user
      ansible.builtin.command:
        cmd: "id -u {{ ansible_user }}"
      register: ansible_user_uid
      changed_when: false

    - name: Get GID of docker group
      ansible.builtin.command:
        cmd: getent group docker
      register: docker_group_info
      changed_when: false

    - name: Set FIXUID in build env file
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.env"
        regexp: "^FIXUID="
        line: "FIXUID={{ ansible_user_uid.stdout }}"

    - name: Set FIXGID in build env file
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.env"
        regexp: "^FIXGID="
        line: "FIXGID={{ docker_group_info.stdout.split(':')[2] }}"

    - name: Copy SSH public key to remote user
      ansible.builtin.copy:
        src: "{{ ansible_ssh_private_key_file }}.pub"
        dest: "/home/{{ ansible_user }}/.ssh/{{ ansible_ssh_private_key_file | basename }}.pub"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Add github.hpe.com to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "10.74.128.57 github.hpe.com"
        state: present

    - name: Clone ssopms-build repo
      ansible.builtin.git:
        repo: git@github.hpe.com:yannick-koehler/ssopms-build.git
        dest: "{{ base_dir }}/ssopms-build"
        depth: 1
        accept_hostkey: true
      become_user: "{{ ansible_user }}"

    - name: Download AWS CLI v2
      ansible.builtin.unarchive:
        src: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: /tmp
        remote_src: true
        creates: /tmp/aws

    - name: Install AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install --update
        creates: /usr/local/bin/aws

    - name: Read build env file
      ansible.builtin.slurp:
        src: "/home/{{ ansible_user }}/.env"
      register: build_env_content

    - name: Parse build env variables
      ansible.builtin.set_fact:
        build_env_vars: "{{ dict(lines | map('regex_replace', '^([^=]+)=(.*)', '\\1') | zip(lines | map('regex_replace', '^([^=]+)=(.*)', '\\2'))) }}"
      vars:
        lines: "{{ (build_env_content.content | b64decode).splitlines() | select('match', '^[A-Za-z_]+=') | list }}"
      no_log: true

    - name: Run dx.sh check --fix
      ansible.builtin.shell:
        cmd: "{{ base_dir }}/ssopms-build/tools/dx.sh check --fix"
        chdir: "{{ base_dir }}"
      become_user: "{{ ansible_user }}"
      environment: "{{ build_env_vars | combine({'GVT_ROOT': base_dir}) }}"

    - name: Copy .env to dev-env
      ansible.builtin.copy:
        src: "/home/{{ ansible_user }}/.env"
        dest: "{{ base_dir }}/dev-env/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0664"
        remote_src: true

    - name: Fix build permissions in dev-env container
      ansible.builtin.shell:
        cmd: >
          docker exec -u root
          $(docker ps -qf "label=com.docker.compose.project=dev-env-{{ base_dir | regex_replace('/', '-') | regex_replace('^-', '') }}" | head -1)
          sh -c "mkdir -p /home/dev/repo/ws/.shared-target /opt/sccache/preprocessor &&
          chmod -R a+rwX /opt/cargo /opt/sccache /home/dev/repo/ws/.shared-target* 2>/dev/null;
          chown -R dev:dev /home/dev/repo/ws/.shared-target* /home/dev/repo/ws 2>/dev/null;
          rm -rf /home/dev/repo/ws/.shared-target/release/build/client-profiler-details-enricher* 2>/dev/null || true"
      become_user: "{{ ansible_user }}"

    - name: Delete stale .npmrc on host
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.npmrc"
        state: absent

    - name: Regenerate .npmrc in dev-env container
      ansible.builtin.shell:
        cmd: >
          docker exec
          $(docker ps -qf "label=com.docker.compose.project=dev-env-{{ base_dir | regex_replace('/', '-') | regex_replace('^-', '') }}" | head -1)
          sh -c 'AUTH=$(printf "%s:%s" "{{ build_env_vars.JFROG_USERNAME }}" "{{ build_env_vars.JFROG_PASSWORD }}" | base64 -w0) &&
          NPMRC="@hpe-cloud-ui:registry=https://aruba.jfrog.io/aruba/api/npm/npm-local/
          @gravity:registry=https://aruba.jfrog.io/aruba/api/npm/npm-local/
          @cnx-ui:registry=https://aruba.jfrog.io/aruba/api/npm/npm-local/
          //aruba.jfrog.io/aruba/api/npm/npm-local/:_auth=${AUTH}
          //aruba.jfrog.io/aruba/api/npm/npm-local/:always-auth=true" &&
          echo "$NPMRC" | sed "s/^  *//" > /home/dev/.npmrc &&
          cp /home/dev/.npmrc /root/.npmrc'
      become_user: "{{ ansible_user }}"
      no_log: true

    - name: Run dx build
      ansible.builtin.shell:
        cmd: yes | /home/{{ ansible_user }}/.local/bin/dx build
        chdir: "{{ base_dir }}"
      become_user: "{{ ansible_user }}"
      environment: "{{ build_env_vars | combine({'GVT_ROOT': base_dir}) }}"

    - name: Run dx update
      ansible.builtin.shell:
        cmd: /home/{{ ansible_user }}/.local/bin/dx update
        chdir: "{{ base_dir }}"
      become_user: "{{ ansible_user }}"
      environment: "{{ build_env_vars | combine({'GVT_ROOT': base_dir}) }}"
